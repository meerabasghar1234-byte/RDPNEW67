name: RDP Configuration Test

on:
  workflow_dispatch:

jobs:
  test-rdp-settings:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:

      - name: Test PowerShell Registry Commands
        shell: powershell
        run: |
          Write-Host "Testing registry paths..."

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          if (-not (Test-Path $rdpPath)) {
              Write-Error "Terminal Server registry path not found."
              exit 1
          }

          if (-not (Test-Path $tcpPath)) {
              Write-Error "RDP-Tcp registry path not found."
              exit 1
          }

          Write-Host "Both registry paths exist."
          Write-Host "PowerShell registry test completed successfully."

      - name: Verify Registry Values
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          $rdp = Get-ItemProperty -Path $rdpPath
          $tcp = Get-ItemProperty -Path $tcpPath

          Write-Host "fDenyTSConnections = $($rdp.fDenyTSConnections)"
          Write-Host "UserAuthentication = $($tcp.UserAuthentication)"
          Write-Host "SecurityLayer = $($tcp.SecurityLayer)"

          Write-Host "Registry verification completed successfully."

      - name: Check Remote Desktop Service
        shell: powershell
        run: |
          $service = Get-Service -Name TermService -ErrorAction SilentlyContinue

          if ($null -eq $service) {
              Write-Host "TermService service was not found."
              exit 0
          }

          Write-Host "TermService Status: $($service.Status)"
          Write-Host "Service check completed."
